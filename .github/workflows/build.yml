name: Build ijkplayer Android

on:
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: ubuntu-20.04 # 建议使用旧版 Ubuntu，兼容性更好

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full yasm nasm pkg-config make git python3

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download and Setup NDK r14b
        run: |
          # ijkplayer 对 NDK 版本非常敏感，r14b 是比较稳定的选择
          wget https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q android-ndk-r14b-linux-x86_64.zip
          echo "ANDROID_NDK=$(pwd)/android-ndk-r14b" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Init Android
        run: |
          ./init-android.sh

      - name: Compile FFmpeg
        run: |
          export ANDROID_NDK=$ANDROID_NDK
          cd android/contrib
          # 这里编译 armv7a 和 arm64，节省时间。如果需要全部，改用 ./compile-ffmpeg.sh all
          ./compile-ffmpeg.sh clean
          ./compile-ffmpeg.sh armv7a
          ./compile-ffmpeg.sh arm64

      - name: Compile ijkplayer
        run: |
          export ANDROID_NDK=$ANDROID_NDK
          cd android
          ./compile-ijk.sh armv7a
          ./compile-ijk.sh arm64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ijkplayer-so-files
          path: |
            android/ijkplayer-armv7a/src/main/libs/
            android/ijkplayer-arm64/src/main/libs/
